services:
  kong:
    image: kong:3.9.4
    container_name: abc-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ./kong/kong.yml
        target: /etc/kong/kong.yml
        read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
