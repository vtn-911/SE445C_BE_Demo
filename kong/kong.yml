_format_version: "3.0"
_transform: true

services:
  - name: abc-retail-process-api
    url: http://backend:3000
    routes:
      - name: abc-retail-public-api
        paths:
          - /api/v1
        strip_path: false
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
          maximum_expiration: 604800
          secret_is_base64: false
          header_names:
            - authorization
          run_on_preflight: true
      - name: rate-limiting
        config:
          minute: 100
          limit_by: ip
          policy: local
          fault_tolerant: false

  - name: abc-retail-mock-crm
    url: http://mock-crm:3200
    routes:
      - name: abc-retail-crm-api
        paths:
          - /api/v1/crm/customers
        methods:
          - PUT
        strip_path: false
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
          maximum_expiration: 604800
          secret_is_base64: false
          header_names:
            - authorization
          run_on_preflight: true
      - name: rate-limiting
        config:
          minute: 100
          limit_by: ip
          policy: local
          fault_tolerant: false

  - name: abc-retail-api-docs
    url: http://backend:3000
    routes:
      - name: abc-retail-public-api-docs
        paths:
          - /docs
          - /openapi.json
        strip_path: false

consumers:
  - username: abc-retail-demo
    jwt_secrets:
      - key: abc-retail-demo
        # Public demo-only signing secret; never use this credential outside local testing.
        secret: "abc-retail-public-demo-secret-do-not-use-in-production"
        algorithm: HS256
