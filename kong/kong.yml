_format_version: "3.0"
_transform: true

services:
  - name: abc-retail-process-api
    url: http://127.0.0.1:3000
    routes:
      - name: abc-retail-public-api
        paths:
          - /api/v1
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          limit_by: ip
          policy: local
          fault_tolerant: false
